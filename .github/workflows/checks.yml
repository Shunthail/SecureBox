name: Checks
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl, pdo_sqlite, fileinfo, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer setup
      - run: composer check
      - run: composer test
      - run: composer audit
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check public/assets/app.js
      - name: Test HTTP transfers
        run: |
          composer start > /tmp/securebox-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3030/api/health && break
            sleep 1
          done
          php tests/http-smoke.php
